[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clubs-of-agents"
version = "0.1.0"
description = "Create durable, structured multi-agent development environments."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Clubs of Agents contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "questionary>=2.0,<3",
  "pyfiglet>=1.0,<2",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
club = "clubs.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clubs = ["templates/*.md", "templates/*.json"]
